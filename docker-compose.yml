# Pokédex: local stack.
#   cp .env.example .env   # then fill in the values
#   docker compose up -d
#
#   open http://localhost:3000 (UI) · http://localhost:8080/swagger-ui (API, demo profile)
#
# Services: postgres → backend (Spring Boot, Flyway migrates on start) → frontend (Next.js standalone) → edge (nginx).
# Offline demo (no internet, WireMock instead of PokeAPI): add `-f docker-compose.offline.yml` (see that file).
#
# Security (docs/security.md §4.8, §4.10):
#   - Credentials come only from .env (git-ignored); compose refuses to start if they are missing.
#   - Image pinned by tag AND digest (bump both together; Dependabot's docker ecosystem can automate this).
#   - Port bound to 127.0.0.1 only: the database is never exposed on the LAN.

name: pokedex

services:
  postgres:
    # PostgreSQL 17 per ADR 0003. Digest verified with `docker buildx imagetools inspect postgres:17.11-alpine`.
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # The container superuser is the schema owner (Flyway). See .env.example.
      POSTGRES_USER: ${FLYWAY_USER:?set FLYWAY_USER in .env}
      POSTGRES_PASSWORD: ${FLYWAY_PASSWORD:?set FLYWAY_PASSWORD in .env}
      # Read by docker/postgres/init/01-app-role.sh to create the least-privilege app role (first start only).
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # Host port is configurable (POSTGRES_PORT in .env) for machines that already run Postgres on 5432.
      # The bind address stays 127.0.0.1 whatever the port.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when the data volume is empty; `docker compose down -v` to re-run it.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ escapes compose interpolation: the variables are expanded inside the container.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: ${DB_URL:?set DB_URL in .env}
      # Runtime connection: the least-privilege app role (DML only, docs/security.md §4.8).
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Migrations run as the schema owner. SPRING_FLYWAY_* is Boot's standard binding (spring.flyway.user /
      # password), so Flyway works today; FLYWAY_USER/FLYWAY_PASSWORD are also passed for the backend's
      # Flyway customizer, which reads them when set.
      FLYWAY_USER: ${FLYWAY_USER:?set FLYWAY_USER in .env}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?set FLYWAY_PASSWORD in .env}
      SPRING_FLYWAY_USER: ${FLYWAY_USER:?set FLYWAY_USER in .env}
      SPRING_FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?set FLYWAY_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 48)}
      JWT_ISSUER: ${JWT_ISSUER:-pokedex-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pokedex-web}
      POKEAPI_BASE_URL: ${POKEAPI_BASE_URL:-https://pokeapi.co/api/v2}
      # Demo seed (demo profile): optional, so Compose starts without them; the seed skips missing ones with a WARN.
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    healthcheck:
      # Status-only actuator health (security.md §4.8): 200 {"status":"UP"} once the app and DB are up.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s
    ports:
      # Direct API access for manual testing (curl, Swagger UI). The browser app goes through the frontend.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    # No published port: browsers reach the frontend only through the edge proxy below.
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true

  edge:
    # nginx in front of Next.js: overwrites X-Forwarded-For with the real client IP (docker/nginx/default.conf).
    # Unprivileged image (non-root, listens on 8080). Pinned by tag AND digest.
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
