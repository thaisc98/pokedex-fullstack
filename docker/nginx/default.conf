# Edge proxy in front of Next.js (docs/security.md §4.1, §4.8).
# Its one security job: OVERWRITE X-Forwarded-For with the real client address, so a browser can't
# choose its own IP and dodge the per-IP login/register rate limits. Next.js passes a client-supplied
# X-Forwarded-For through unchanged, and Spring trusts it from private-network proxies (TRUSTED_PROXIES).
server_tokens off;

server {
    listen 8080;
    server_name _;

    # Request bodies are capped at 16 KB by the backend (413); allow a little headroom here.
    client_max_body_size 32k;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr, not $proxy_add_x_forwarded_for: never keep a client-supplied value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}
