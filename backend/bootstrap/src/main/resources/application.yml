spring:
  application:
    name: pokedex
  threads:
    virtual:
      enabled: true
  http:
    clients:
      # Never follow upstream redirects (security.md §4.5).
      redirects: dont-follow
    serviceclient:
      pokeapi:
        base-url: ${pokeapi.base-url}
        connect-timeout: 2s
        read-timeout: 5s
  # PostgreSQL (ADR 0003). Credentials only from the environment (security.md §4.8); ITs use @ServiceConnection.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokedex}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# Actuator (security.md §4.8): only `health` over HTTP, status only ({"status":"UP"}), nothing else exposed.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      # No liveness/readiness groups: they would be advertised in the body ("groups"), and the contract is status only.
      probes:
        enabled: false

# OpenAPI docs and Swagger UI are off by default; only the demo profile turns them on (security.md §3.2).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

pokedex:
  catalog:
    # security.md §4.7, ADR 0004: browser and shared-cache policy for public catalog 200s only.
    http-cache:
      max-age: 300s
      stale-while-revalidate: 86400s
  security:
    # Only application-demo.yml sets this to true. Otherwise the springdoc routes stay denied (401).
    api-docs-public: false
    # security.md §4.2. The app refuses to start unless JWT_SECRET has at least 256 bits (32 UTF-8 bytes).
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:pokedex-api}
      audience: ${JWT_AUDIENCE:pokedex-web}
      lifetime: 60m
      clock-skew: 30s
    # security.md §4.1 (Bucket4j, per IP + email / per IP)
    rate-limit:
      login-per-minute: 5
      registrations-per-minute: 3

server:
  # Client IP for the rate limits (security.md §4.1): X-Forwarded-For is honoured only when the direct peer is a
  # trusted proxy (the Next.js server). TRUSTED_PROXIES is a regex of proxy IPs; the default is the private and
  # loopback ranges, like Tomcat's own default. A client calling Spring directly cannot spoof its IP.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '${TRUSTED_PROXIES:10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|169\.254\.\d+\.\d+|127\.\d+\.\d+\.\d+|172\.(1[6-9]|2[0-9]|3[0-1])\.\d+\.\d+|100\.(6[4-9]|[7-9][0-9]|1[0-1][0-9]|12[0-7])\.\d+\.\d+|0:0:0:0:0:0:0:1|::1}'
  # BREACH (security.md §4.2.1): GET /auth/csrf returns the unmasked CSRF token, so responses are never compressed.
  compression:
    enabled: false
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

# PokeAPI (security.md §4.5: the base URL comes from configuration only).
pokeapi:
  base-url: https://pokeapi.co/api/v2
  retry:
    max-retries: 3
    delay: 200ms
  max-concurrency: 10
  # security.md §4.5: larger responses are rejected (503 upstream-unavailable).
  max-response-bytes: 1048576
  cache:
    max-pages: 500
    max-resources: 2000
    ttl: 24h
