spring:
  application:
    name: pokedex
  threads:
    virtual:
      enabled: true
  http:
    clients:
      # Never follow upstream redirects (security.md §4.5).
      redirects: dont-follow
    serviceclient:
      pokeapi:
        base-url: ${pokeapi.base-url}
        connect-timeout: 2s
        read-timeout: 5s

# OpenAPI docs and Swagger UI are off by default; only the demo profile turns them on (security.md §3.2).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

pokedex:
  security:
    # Only application-demo.yml sets this to true. Otherwise the springdoc routes stay denied (401).
    api-docs-public: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

# PokeAPI (security.md §4.5: the base URL comes from configuration only).
pokeapi:
  base-url: https://pokeapi.co/api/v2
  retry:
    max-retries: 3
    delay: 200ms
  max-concurrency: 10
  # security.md §4.5: larger responses are rejected (503 upstream-unavailable).
  max-response-bytes: 1048576
  cache:
    max-pages: 500
    max-resources: 2000
    ttl: 24h
