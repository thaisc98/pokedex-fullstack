# CI pipeline. Grows phase by phase (see docs/roadmap.md):
#   now      → secret scan
#   Phase 0  → backend (./mvnw verify) + frontend (lint, typecheck, test, build) + dependency scanning
#   P4–P5    → e2e (Playwright vs docker compose --profile offline) + API contract check
#   P6       → Docker build, image scan, OWASP ZAP baseline
#
# Security rules (docs/security.md §4.10):
#   - Third-party actions are pinned to a full commit SHA (the tag is in the comment). Dependabot updates both.
#   - Least-privilege GITHUB_TOKEN: read-only by default; jobs ask only for what they need.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly full-history secret scan (Mondays 04:00 UTC)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the GitHub API
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A license is only required for organization-owned repos; this is a personal account.
          GITLEAKS_ENABLE_COMMENTS: "false" # would need pull-requests: write; findings show in the job summary
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_VERSION: "8.24.3" # pin the scanner binary (the action otherwise allows "latest")
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false" # public repo: artifacts are downloadable by others; keep the report off them

  backend:
    name: Backend (./mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin 25 (Maven cache)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      # Unit tests (Surefire), integration tests (Failsafe + Testcontainers; Docker is preinstalled on
      # ubuntu-latest), enforcer, ArchUnit, Spotless check and JaCoCo gates all run in `verify`.
      - name: Build and test
        run: ./mvnw -B -ntp verify

  dependency-scan:
    name: Dependency scan (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # the first run downloads the full NVD database
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin 25 (Maven cache)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      # Maven 3.9 only WARNS when a requested profile doesn't exist, so a missing/renamed profile would make this
      # job silently green without scanning anything. Fail closed instead.
      - name: Require the security profile
        run: |
          if ! grep -q '<id>security</id>' pom.xml; then
            echo "::error file=backend/pom.xml::Maven profile 'security' (Dependency-Check + CycloneDX) is not defined"
            exit 1
          fi

      # Restore the last NVD database so each run only downloads deltas. run_id makes every save a new key;
      # restore-keys picks the most recent one.
      - name: Cache NVD database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      # Tests are skipped here: the backend job already runs them.
      # The `security` profile (backend/pom.xml) runs Dependency-Check (fails on CVSS >= 7, docs/security.md §4.10)
      # and the CycloneDX SBOM. Reports stay on the runner: public repo, so no artifact upload.
      - name: Dependency-Check + SBOM
        run: ./mvnw -B -ntp -Psecurity -DskipTests verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  # TODO(Phase 0, frontend): add once frontend/package.json and package-lock.json exist.
  #   frontend:
  #     - actions/setup-node (pinned SHA) with node-version-file: .nvmrc, cache: npm, cache-dependency-path: frontend/package-lock.json
  #     - npm ci → npm run lint → npx tsc --noEmit → npm test → npm run build   (working-directory: frontend)
  #   frontend-audit:
  #     - npm ci → npm audit --audit-level=high   (docs/security.md §4.10)
  #     - CycloneDX SBOM for the frontend; no artifact upload (public repo)
