# Dependabot: keeps dependencies (and the commit SHAs pinned in workflows) up to date.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  # Backend libraries and Maven plugins (backend/pom.xml + module POMs).
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - java
    ignore:
      # The stack is pinned to Spring Boot 4.1.x (AGENTS.md); a minor or major upgrade needs an ADR.
      # Patch releases still come through (they carry security fixes).
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      maven-minor-and-patch:
        update-types: ["minor", "patch"]

  # Frontend packages (frontend/package.json + package-lock.json).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - javascript
    ignore:
      # The stack is pinned to Next.js 16, React 19 and HeroUI v3 (AGENTS.md); a major upgrade needs an ADR.
      # Minor and patch releases still come through (they carry security fixes).
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@heroui/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@heroui/styles"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is blocked until openapi-typescript and typescript-eslint support it. Their peer ranges
      # today (checked 2026-10-21): openapi-typescript "typescript": "^5.x", typescript-eslint ">=4.8.4 <6.1.0".
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # Images in docker-compose.yml (tag + digest), e.g. postgres.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker
    ignore:
      # ADR 0003 picked PostgreSQL 17; a major upgrade needs a new ADR (and a data migration plan).
      # Minor and patch releases of 17.x still come through.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
